worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Access logs intentionally omit URLs, query strings, addresses, referrers,
    # and user agents because those fields may contain banking identifiers or
    # secrets. Laravel's completion log supplies the safe route name.
    log_format main escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"request_id":"$upstream_http_x_request_id",'
        '"method":"$request_method",'
        '"status":$status,'
        '"response_bytes":$body_bytes_sent,'
        '"request_seconds":$request_time,'
        '"upstream_seconds":"$upstream_response_time"'
    '}';

    access_log /dev/stdout main;
    sendfile on;
    keepalive_timeout 65;

    # Nginx can write temporary request data without gaining root access.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}
