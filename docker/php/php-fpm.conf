[global]
daemonize = no
error_log = /proc/self/fd/2

[www]
; The whole container already runs as the unprivileged banking user, so this
; pool does not need permission to switch operating-system users.
listen = 0.0.0.0:9000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

ping.path = /fpm-ping
pm.status_path = /fpm-status

